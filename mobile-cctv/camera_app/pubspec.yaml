publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.11.7
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  qr_flutter: ^4.1.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.4
  video_player: ^2.9.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
